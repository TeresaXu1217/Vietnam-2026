    const Sparkles = ({size=24, className="", strokeWidth=2}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 17v4"/><path d="M17 19h4"/></svg>);

    // --- Gemini API Setup ---
    const apiKey = "";

    const generateLocationStory = async (locationTitle) => {
      const prompt = `你是一位為日系生活風格雜誌撰稿的旅遊編輯。請為即將前往越南胡志明市「${locationTitle}」的旅客，寫一段約 80 字的優雅景點介紹，以及一個簡單實用的在地小提醒。
      回覆格式請嚴格遵守：
      【景點印象】
      (你的介紹文字)

      【編輯私提醒】
      (你的提醒文字)

      風格要求：安靜、溫柔、帶有哲學感與生活美學。繁體中文。`;

      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "你是一個具有日系質感的旅遊雜誌編輯。" }] }
      };

      const delay = (ms) => new Promise(res => setTimeout(res, ms));
      const retries = [1000, 2000, 4000, 8000, 16000];

      for (let i = 0; i < retries.length; i++) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error('API Error');
          const data = await response.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || "無法獲取導覽資訊。";
        } catch (error) {
          if (i === retries.length - 1) return "目前無法聯繫 AI 導遊，請稍後再試。";
          await delay(retries[i]);
        }
      }
    };

    // --- Data ---
    const itineraryData = [

          { time: "18:10", title: "MIUMIU SPA 5", duration: "2時00分", desc: "放鬆按摩行程" },
          { time: "20:15", title: "阮惠街（Đường Nguyễn Huệ）", duration: "30分", desc: "步行街散策" },

        setAiModalOpen(true);
        setAiContent("");

        setIsLoadingAi(false);

                    <img 
                      src="https://images.unsplash.com/photo-1583417646731-0eb1be07ac75?auto=format&fit=crop&q=80&w=1000"

                      <div>

                        <ul className="space-y-5 text-sm leading-relaxed tracking-wide">
                          <li className="flex items-start gap-3"><span className="mt-1 text-[#8C8C8C]"><Check size={14} /></span><div><span className="font-medium text-[#4A4A4A]">重要文件：</span>護照正本、越南簽證、個人證件。</div></li>
                          <li className="flex items-start gap-3"><span className="mt-1 text-[#8C8C8C]"><Check size={14} /></span><div><span className="font-medium text-[#4A4A4A]">金流：</span>手機與充電線、轉接頭、台幣 (5,000元/人)、越南盾。</div></li>

                              <span>SGN 新山一 (T2)</span>
                            </div>
                            <div className="mt-2 text-[11px] text-[#8C8C8C] tracking-wider text-center">長榮航空 BR391 | 波音 777-300ER</div>
                          </div>
                          <div className="w-full h-[1px] bg-[#E5E0D8]"></div>
                          <div>
                            <div className="text-xs text-[#8C8C8C] tracking-widest mb-2">返回 | 2026.05.03</div>
                            <div className="flex justify-between items-center mb-1">
                              <div className="font-serif-tc text-xl">16:30</div>
                              <div className="h-[1px] flex-1 mx-4 bg-gradient-to-r from-transparent via-[#D9D4CD] to-transparent relative">
                                 <Plane size={12} className="absolute top-1/2 left-1/2 -translate-y-1/2 -translate-x-1/2 text-[#8C8C8C] rotate-180" />
                              </div>
                              <div className="font-serif-tc text-xl">21:05</div>
                            </div>
                            <div className="flex justify-between text-xs tracking-wider text-[#666]">
                              <span>SGN 新山一 (T2)</span>
                              <span>TPE 桃園 (T2)</span>
                            </div>
                            <div className="mt-2 text-[11px] text-[#8C8C8C] tracking-wider text-center">越南航空 VN570 | 空中巴士 A321</div>
                          </div>
                        </div>
                      </div>

                      <div>
                        <h3 className="font-serif-tc text-lg text-[#4A4A4A] border-b border-[#E5E0D8] pb-3 mb-6 flex items-center gap-2">
                          <Home size={18} strokeWidth={1.5} /> 住宿
                        </h3>
                        <a href={getMapLink("Aurora Serviced Apartments 103 Võ Văn Tần 胡志明市")} target="_blank" rel="noopener noreferrer" className="group relative overflow-hidden aspect-[16/9] bg-[#E5E0D8] flex items-center justify-center block">
                           <img 
                             src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&q=80&w=800" 
                             alt="住宿示意圖" 
                             className="absolute inset-0 w-full h-full object-cover opacity-80 photo-filter group-hover:scale-105 transition-transform duration-700"
                           />
                           <div className="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition-colors"></div>
                           <div className="relative z-10 text-center text-white p-4">
                             <p className="font-serif-tc text-xl mb-1 tracking-wider flex items-center justify-center gap-2">
                                Aurora Serviced Apartments <MapPin size={16} className="opacity-0 group-hover:opacity-100 transition-opacity" />
                             </p>
                             <p className="text-xs tracking-widest opacity-80 font-light">103 Võ Văn Tần</p>
                           </div>
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* --- TAB: DAYS (ITINERARY) --- */}
            {activeTab.startsWith('day') && (
              <section className="px-6 md:px-24 py-12 md:py-16 bg-[#F9F8F6] fade-in">
                {(() => {
                  const dayIndex = parseInt(activeTab.replace('day', ''));
                  const dayData = itineraryData[dayIndex];
                  return (
                    <div className="max-w-3xl mx-auto">
                      <div className="mb-16 flex items-start gap-6 border-b border-[#E5E0D8] pb-8">
                        <div className="font-serif-tc text-5xl text-[#D9D4CD]">0{dayIndex + 2}</div>
                        <div>
                          <h2 className="font-serif-tc text-3xl text-[#333] tracking-wider mb-2">{dayData.day} 行程</h2>
                          <p className="text-xs tracking-[0.2em] text-[#8A252C] uppercase">{dayData.date}</p>
                        </div>
                      </div>

                      <div className="relative border-l-[0.5px] border-[#D9D4CD] ml-3 pl-8 space-y-12">
                        {dayData.events.map((event, eIndex) => (
                          <div key={eIndex} className="relative group">
                            <div className="absolute -left-[37px] top-1.5 w-[9px] h-[9px] bg-[#F9F8F6] border border-[#8C8C8C] rounded-full group-hover:border-[#8A252C] group-hover:bg-[#8A252C] transition-colors duration-300"></div>
                            
                            <div className="flex flex-col sm:flex-row sm:items-baseline gap-2 sm:gap-6">
                              <div className="w-14 shrink-0 font-serif-tc text-[#4A4A4A] tracking-wider text-lg">
                                {event.time}
                              </div>
                              <div className="flex-1">
                                <div className="flex items-center flex-wrap gap-4 mb-2">
                                  <a 
                                    href={getMapLink(`${event.title} ${event.title.includes('機場') ? '' : '胡志明市'}`)} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="text-[16px] font-medium tracking-wide text-[#333] hover:text-[#8A252C] transition-colors flex items-center gap-1.5 group/map"
                                    title="在 Google Maps 中開啟"
                                  >
                                    {event.title}
                                    <MapPin size={13} className="text-[#8C8C8C] group-hover/map:text-[#8A252C] opacity-50 group-hover/map:opacity-100 transition-all" />
                                  </a>

                                  {event.title !== "Aurora Serviced Apartments" && event.title !== "新山一國際機場" && (
                                    <button 
                                      onClick={() => openAiGuide(event.title)}
                                      className="flex items-center gap-1 text-[10px] tracking-widest text-[#8A252C] bg-[#8A252C]/5 px-2 py-1 rounded hover:bg-[#8A252C]/15 transition-colors"
                                    >
                                      <Sparkles size={12} strokeWidth={2} />
                                      <span>AI 導覽</span>
                                    </button>
                                  )}
                                </div>
                                <div className="flex items-center gap-3 text-xs text-[#8C8C8C]">
                                  <span className="flex items-center gap-1 opacity-70">
                                    <Clock size={12} /> 停留 {event.duration}
                                  </span>
                                  {event.desc && (
                                    <React.Fragment>
                                      <span className="w-1 h-1 rounded-full bg-[#D9D4CD]"></span>
                                      <span>{event.desc}</span>
                                    </React.Fragment>
                                  )}
                                </div>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </section>
            )}
          </main>

          {/* --- FOOTER --- */}
          <footer className="px-6 md:px-24 pt-12 pb-24 text-center border-t border-[#E5E0D8] bg-white">
            <p className="font-serif-tc text-xl text-[#4A4A4A] mb-3">祝您旅途愉快</p>
            <p className="text-xs tracking-[0.3em] text-[#8C8C8C] uppercase mb-12">Have a safe and wonderful trip</p>
            
            <div className="inline-block bg-[#F9F8F6] px-6 py-5 border border-[#E5E0D8] shadow-sm rounded-sm">
              <p className="text-[11px] text-[#8C8C8C] mb-3 tracking-widest flex items-center justify-center gap-1.5 font-medium">
                <MapPin size={12}/> 以便需要 · 備用行程
              </p>
              <a 
                href="https://chictrip-share.app.link/iTbUFLaSA2b" 
                target="_blank" 
                rel="noopener noreferrer" 
                className="inline-flex items-center justify-center bg-[#8A252C] text-[#F9F8F6] hover:bg-[#6A1A20] transition-colors font-serif-tc tracking-wider text-sm px-6 py-2.5 rounded-full shadow-sm"
              >
                點此開啟 ChicTrip 完整行程
              </a>
            </div>
            
            <div className="w-8 h-[1px] bg-[#8A252C]/30 mx-auto mt-12"></div>
          </footer>

          {/* --- FLOATING WEATHER BUTTON --- */}
          <a 
            href="https://www.accuweather.com/zh/vn/ho-chi-minh-city/353981/weather-forecast/353981#google_vignette" 
            target="_blank" 
            rel="noopener noreferrer"
            className="fixed bottom-6 right-6 z-40 bg-[#F9F8F6]/90 backdrop-blur-md border border-[#E5E0D8] text-[#4A4A4A] hover:text-[#8A252C] hover:border-[#8A252C] px-4 py-3 rounded-full shadow-lg flex items-center gap-2 transition-all fade-in"
          >
            <Sun size={18} />
            <span className="text-[13px] tracking-widest font-serif-tc font-medium">當地氣象</span>
          </a>

          {/* --- AI Guide Modal --- */}
          {aiModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm transition-all duration-500 fade-in">
              <div className="bg-[#F9F8F6] w-full max-w-md p-8 relative shadow-2xl overflow-hidden border border-[#D9D4CD]">
                <div className="absolute -top-10 -right-10 text-[#8A252C] font-serif-tc text-9xl opacity-5 pointer-events-none">旅</div>
                
                <button 
                  onClick={() => setAiModalOpen(false)}
                  className="absolute top-6 right-6 text-[#8C8C8C] hover:text-[#8A252C] transition-colors"
                >
                  <X size={20} strokeWidth={1.5} />
                </button>
                
                <div className="flex items-center gap-2 text-[#8A252C] mb-6">
                  <Sparkles size={16} />
                  <span className="text-xs tracking-[0.2em] uppercase font-light">AI Pocket Guide</span>
                </div>
                
                <h3 className="font-serif-tc text-2xl text-[#333] mb-6 leading-relaxed border-b border-[#E5E0D8] pb-4">
                  {activeLocation}
                </h3>
                
                <div className="min-h-[160px] text-[13px] leading-loose tracking-wider text-[#666]">
                  {isLoadingAi ? (
                    <div className="flex flex-col items-center justify-center h-[160px] space-y-4 opacity-70">
                      <Loader2 size={24} className="animate-spin text-[#8A252C]" />
                      <p className="font-serif-tc text-[#8A252C] tracking-widest animate-pulse">翻閱當地紀事中...</p>
                    </div>
                  ) : (
                    <div className="space-y-4 whitespace-pre-wrap font-serif-tc">
                      {aiContent}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // 渲染應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
