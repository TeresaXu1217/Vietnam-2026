    // --- Gemini API Setup ---

    // 共用的 API 呼叫函式 (加入指數退避重試機制)
    const callGeminiApi = async (prompt, systemInstructionText) => {
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: systemInstructionText }] }
      };

      const delay = (ms) => new Promise(res => setTimeout(res, ms));
      const retries = [1000, 2000, 4000, 8000, 16000];

      for (let i = 0; i < retries.length; i++) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error('API Error');
          const data = await response.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text;
        } catch (error) {
          if (i === retries.length - 1) return null;
          await delay(retries[i]);
        }
      }
    };

      風格要求：安靜、溫柔、帶有哲學感與生活美學。繁體中文。`;

      return result || "無法獲取導覽資訊。";
    };

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // 渲染應用程式
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
